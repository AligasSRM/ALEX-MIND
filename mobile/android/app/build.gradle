plugins {
    id "com.android.application"
}

android {
    namespace "com.alexmind.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.alexmind.app"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }
}
