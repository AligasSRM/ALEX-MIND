name: Desktop builds

on:
  push:
    branches: ["android-app-v0.1"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build Windows EXE
        working-directory: desktop/windows
        shell: pwsh
        run: ./build.ps1
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ALEX-MIND-windows-exe
          path: desktop/windows/dist/*.exe
