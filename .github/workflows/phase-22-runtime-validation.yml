name: Phase 22 runtime validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to validate
        required: false
        default: phase-22-control-integration

jobs:
  runtime-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation target
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate Worker syntax
        run: node --check worker.js

      - name: Run Cloudflare integration harness
        run: npm run test:runtime
