name: Phase 22 runtime validation

on:
  push:
    branches:
      - phase-22-control-integration
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  runtime-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-22-control-integration
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Validate worker syntax
        run: node --check worker.js
      - name: Run Cloudflare integration harness
        run: npm run test:runtime
